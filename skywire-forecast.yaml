version: "1"
kind: miner
id: 7305
slug: skywire-forecast
protocol: generic
name: SkyWire Weather Forecast
description: >
  Multi-day forecast for a named place, read live from the open-meteo daily API at
  request time and returned as one sentence per day: high, low, sky and rain chance.
  Answers the WEATHER_FORECAST intent for anywhere open-meteo can geocode. Defaults to
  three days. No API key, nothing cached that can go stale.
base_url: https://telegraph-sky.margyn.workers.dev

docs:
  documentation: https://telegraph-sky.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: location is a place name such as London, Paris or Tokyo. days is 1 to 7 and defaults to 3. A whole question is accepted too.
    param: location
    property: length
    value_num: 80
    operator: lte

rate_limit_per_sec: 20
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    location:
      type: string
      description: Place name to forecast for, for example London or Tokyo.
    days:
      type: integer
      description: Number of days to forecast, 1 to 7, default 3.
  required:
    - location

output_schema:
  type: object
  properties:
    location:
      type: string
      description: Canonical place name the forecast refers to.
    country:
      type: string
      description: Country of the resolved place.
    forecast_days:
      type: integer
      description: Number of days returned.
    days:
      type: array
      description: Per-day high, low, condition and rain probability.
    confidence:
      type: number
      description: 0.95 for a direct open-meteo read.
    summary:
      type: string
      description: One sentence per day with high, low, condition and rain chance.

endpoints:
  - path: /forecast
    external_path: /forecast
    method: GET
    description: >
      Forecast for one place, location as a query parameter (?location=London&days=3).
      Also accepts a whole question in ?query=.
  - path: /forecast/{location}
    external_path: /forecast/{location}
    method: GET
    description: >
      Same answer with the place in the path. An unsubstituted template resolves to
      London rather than erroring.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - WEATHER_FORECAST

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: location
        description: Canonical place name the forecast refers to.
        source_path: location
      - index: 1
        name: summary
        description: One sentence per day with high, low, condition and rain chance.
        source_path: summary
      - index: 2
        name: country
        description: Country of the resolved place.
        source_path: country
    integers:
      - index: 0
        name: forecast_days
        description: Number of days returned.
        source_path: forecast_days
        multiplier: 1
  request:
    - endpoint: forecast
      method: GET
      query_params:
        location: { source: strings.0 }
